name: Workflow 1

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
      skip_tests:
        required: false
        default: 'false'
  push:
    branches:
      - dev
      - staging
      - master

jobs:
  job-1:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.step-1.outputs.environment }}
    steps:
      - name: Dummy step 1
        id: step-1
        uses: PG-Momik/shared-actions/actions/action-1@4fb866cd843bb1af966132c7d5f71d9d56f07bb3
        with:
          use-master: true

  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    if: github.event.inputs.skip_tests == 'true'
    steps:
      - name: Dummy step 1
        run: echo "dummy step"
      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-8@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

  job-3:
    name: Job 3
    runs-on: ubuntu-latest
    needs: job-1
    if: github.event.inputs.skip_tests == 'true' && needs.job-1.outputs.environment == 'production'
    environment: production-no-tests
    steps:
      - name: Dummy step 1
        run: echo "dummy step"

  job-4:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'
    needs: job-1
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-52
      cancel-in-progress: true
    uses: ./.github/workflows/workflow-2.yml
    secrets: inherit
    permissions:
      contents: read
      actions: read

  job-5:
    name: Job 5
    needs: [job-4, job-6, job-1]
    if: always() && (needs.job-4.result == 'failure' || needs.job-6.result == 'failure')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dummy step 1
        uses: PG-Momik/shared-actions/actions/action-8@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

  job-6:
    if: ${{ !cancelled() && needs['job-1'].result == 'success' && (needs.job-4.result == 'success' || needs.job-4.result == 'skipped') }}
    needs: [job-4, job-1]
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}
    permissions:
      id-token: write
      contents: read
      actions: write
    strategy:
      matrix:
        image-type: [web, worker]
      fail-fast: true
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dummy step 2
        run: echo "dummy step"

      - name: Dummy step 3
        run: echo "dummy step"

      - name: Dummy step 4
        run: echo "dummy step"

      - name: Dummy step 5
        run: echo "dummy step"

      - name: Dummy step 6
        run: echo "dummy step"

      - name: Dummy step 7
        if: matrix.image-type == 'web'
        run: echo "dummy step"

      - name: Dummy step 8
        if: matrix.image-type == 'worker'
        run: echo "dummy step"

  job-7:
    if: ${{ !cancelled() && needs['job-1'].result == 'success' && (needs.job-4.result == 'success' || needs.job-4.result == 'skipped') && needs['job-6'].result == 'success' && (needs['job-3'].result == 'success' || needs['job-3'].result == 'skipped') }}
    needs: [job-4, job-6, job-1, job-3]
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dummy step 2
        run: echo "dummy step"

      - name: Dummy step 3
        run: echo "dummy step"

      - name: Dummy step 4
        run: echo "dummy step"

      - name: Dummy step 5
        run: echo "dummy step"

      - name: Dummy step 6
        run: echo "dummy step"

      - name: Dummy step 7
        run: echo "dummy step"

      - name: Dummy step 8
        id: step-1
        run: echo "dummy step"

      - name: Dummy step 9
        run: echo "dummy step"

      - name: Dummy step 10
        id: step-2
        run: echo "dummy step"

      - name: Dummy step 11
        run: echo "dummy step"

      - name: Dummy step 12
        continue-on-error: true
        id: step-3
        run: echo "dummy step"

      - name: Dummy step 13
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-4@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

      - name: Dummy step 14
        continue-on-error: true
        id: step-4
        run: echo "dummy step"

      - name: Dummy step 15
        continue-on-error: true
        uses: PG-Momik/shared-actions/actions/action-4@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

      - name: Dummy step 16
        if: always()
        uses: PG-Momik/shared-actions/actions/action-8@4fb866cd843bb1af966132c7d5f71d9d56f07bb3

  job-8:
    if: ${{ !cancelled() && needs.job-7.result == 'success' && needs.job-1.outputs.environment == 'production' }}
    needs: [job-7, job-1]
    runs-on: ubuntu-latest
    environment: ${{ needs.job-1.outputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Dummy step 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Dummy step 2
        uses: PG-Momik/shared-actions/actions/action-3@4fb866cd843bb1af966132c7d5f71d9d56f07bb3
